name: generate arcade contribution graphs

on:
    schedule:
        - cron: '0 0 * * *'   # runs daily at midnight UTC
    workflow_dispatch:         # lets you trigger manually
    push:
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate contribution graph SVGs
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  games: 'pacman,galaga'   # comma-separated: pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper

            - name: push SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
